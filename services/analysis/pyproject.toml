[project]
name = "kale-analysis"
version = "0.1.0"
description = "Kale.ai analysis service: parsing, deterministic rules, power analysis, retrieval, chat orchestration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3.0"]  # heavy (torch); hash-fallback embedder used when absent
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Serving path for the v18 design adapter, which is a PEFT LoRA over Qwen3-4B-Instruct-2507
# rather than an MLX adapter like v15..v17.  lm-format-enforcer is not optional: the
# Transformers provider refuses to sample a structured request without it rather than emit
# unconstrained JSON, so leaving it out degrades every design to deterministic synthesis.
transformers = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.33",
    "lm-format-enforcer>=0.11,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

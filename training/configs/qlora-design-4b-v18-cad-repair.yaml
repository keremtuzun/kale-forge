# Short, low-LR continuation driven by observed v18 CAD failures.
base_model: Qwen/Qwen3-4B-Instruct-2507
initial_adapter: models/adapters/kale-design-qwen3-4b-v18
dataset_dir: datasets/processed/design-v18-cad-repair
dataset_version: design-v18-cad-repair
seed: 43
lr: 0.00001
epochs: 1
max_steps: 100
per_device_batch: 1
grad_accum: 4
max_seq_len: 3072
packing: false
gradient_checkpointing: true
optim: paged_adamw_8bit
warmup_ratio: 0.1
logging_steps: 10
save_steps: 50
save_total_limit: 2
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
quantization:
  enabled: true
  bits: 4
  type: nf4
  compute_dtype: float16
  double_quant: true
tracking:
  backend: none
output_dir: models/adapters/kale-design-qwen3-4b-v18-cad-repair
eval_per_epoch: false

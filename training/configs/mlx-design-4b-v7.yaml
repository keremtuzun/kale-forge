# Kale Forge Design Model — adapter v7 (MLX LoRA)
# Mirrors v6 hyperparameters; trained on design-v7, which enriches the intake vocabulary,
# techniques, catalog parts and diagnoses derived from FRC CAD references.
# NOTE: on this host the actual run happens off the iCloud Desktop, on local disk
# (/private/tmp), with the non-Anaconda MLX env at work/mlx-training-env — iCloud read
# latency otherwise stalls imports. Paths below are the repo-canonical locations; the
# launch copies dataset + adapter to /private/tmp and copies the adapter back here.
model: mlx-community/Qwen3-4B-Instruct-2507-4bit
train: true
data: datasets/processed/design-v7
fine_tune_type: lora
adapter_path: models/adapters/kale-design-qwen3-4b-v7
seed: 42
iters: 600
batch_size: 1
grad_accumulation_steps: 4
learning_rate: 0.0001
num_layers: 6
max_seq_length: 2048
mask_prompt: true
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 200
save_every: 200
val_batches: 8

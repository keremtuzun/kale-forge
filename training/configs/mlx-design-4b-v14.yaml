# Kale Forge Design Model — adapter v14 (MLX LoRA)
#
# v14 is v11's recipe with ONE change: max_seq_length 2048 → 3072.
#
# That is the whole point. v11 trained 900 iterations without a NaN and its only defect was
# measured and specific — 47.7% of its cad_geometry targets were silently truncated at 2048,
# which taught the model to emit JSON that never closes and halved its CAD validity. The fix
# for that is the window, and nothing else.
#
# v12 and v13 are why this config is written the way it is. Both raised capacity alongside the
# window — rank 8→16, num_layers 6→8 (2.753M → 7.340M params), dropout 0→0.05, plus a cosine
# schedule — and both failed in the same place:
#
#   v12 (peak LR 1e-4): train loss held 0.5-1.0 to iter 340, then 1.99 → 5.71 → 7.73. Killed.
#   v13 (peak LR 3e-5): val 2.019 → 1.497 → 1.163, then NaN at iter 400. Killed.
#
# A 3.3x LR reduction moved the symptom (explosion → NaN) and not the location, which rules out
# the learning rate as the driver. Ruled out by direct measurement, not by assumption:
#
#   * no row exceeds the window (longest 2948 of 3072) — checked both splits;
#   * no row yields ntoks == 0 in `default_loss`, the div-by-zero that produces NaN — checked
#     every row against the trainer's own masking arithmetic;
#   * the batch at iteration 400 is a 186-token `technique` row, and the longest sequence in
#     the first 500 iterations (2848 tokens, iter 146) trained through cleanly — reconstructed
#     from the trainer's sort-then-permute order under the same seed.
#
# So the trigger is one of the capacity changes interacting with the 4-bit base, and the way to
# find out which is to add them back one at a time on top of a run that works. v14 establishes
# that baseline. It is the config the v12 comment block already committed to and then ignored:
# change the one thing that was broken, so that an improvement has one credible explanation.
#
# Kept from v12/v13 because neither can affect training stability:
#   data: design-v12   — the larger corpus (3768 rows vs 2858), more of everything
#   val_batches: 25    — v11's 8 was too noisy to select a checkpoint on, which is how its
#                        iteration 800 and 900 came to disagree by 3x with neither being good
#   steps_per_eval 100 — so checkpoint selection has something to select on
#
# iters: 800, not v11's 900. v11's final checkpoint scored worse than its 800 (val 0.279 vs
# 0.095) on a flat LR; there is no reason to buy that overshoot again.
#
# THE HOST IS AN 8 GB M2. v11's recipe peaked at 5.382 GB at 2048; the wider window will raise
# that, and v12 at rank 16 / 8 layers reached 6.931 GB. Back at rank 8 / 6 layers this should
# land between the two, which is the other reason not to carry the capacity increase yet.
model: mlx-community/Qwen3-4B-Instruct-2507-4bit
train: true
data: datasets/processed/design-v12
fine_tune_type: lora
adapter_path: models/adapters/kale-design-qwen3-4b-v14
seed: 42
iters: 800
batch_size: 1
grad_accumulation_steps: 4
learning_rate: 0.0001
num_layers: 6
max_seq_length: 3072
mask_prompt: true
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 100
save_every: 100
val_batches: 25

# QLoRA SFT on Qwen2.5-7B-Instruct — 4-bit NF4 base + bf16 compute, fits ~12 GB VRAM.
base_model: Qwen/Qwen2.5-7B-Instruct
dataset_dir: datasets/processed/latest
dataset_version: latest
seed: 42
lr: 0.0002
epochs: 3
per_device_batch: 1
grad_accum: 16
max_seq_len: 4096
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
quantization:
  enabled: true
  bits: 4
  type: nf4
  compute_dtype: bfloat16
  double_quant: true
tracking:
  backend: mlflow
  uri: file:./mlruns
output_dir: models/adapters/qlora-default
eval_per_epoch: true
